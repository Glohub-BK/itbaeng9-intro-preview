<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>한 점의 상상 · IT뱅구</title><style>
@font-face{font-family:Pretendard;src:url('assets/fonts/Pretendard-Regular.woff2');font-weight:400;font-display:block}@font-face{font-family:Pretendard;src:url('assets/fonts/Pretendard-Bold.woff2');font-weight:700;font-display:block}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#10110f;color:#f2f0e6;font-family:Pretendard,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:38px 32px 30px}header{width:min(1240px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}header strong{font-size:24px;letter-spacing:-.045em}header span{color:#a8aaa3;font-size:13px;letter-spacing:.08em}.player{width:min(1400px,100%);background:#0a0c08;border:1px solid #31372b;border-radius:20px;overflow:hidden;box-shadow:0 30px 110px #0006}.screen{width:100%;aspect-ratio:16/9;overflow:hidden}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:15px;align-items:center;padding:17px 22px;min-height:74px;background:#191d14;border-top:1px solid #31372b}button{font:700 14px Pretendard;color:#f2f0e6;cursor:pointer;background:#262e1f;border:1px solid #45503b;border-radius:9px;padding:10px 15px;white-space:nowrap}button.primary{background:#c8ff64;color:#10110f;border-color:#c8ff64;min-width:82px}button:focus-visible,input:focus-visible{outline:2px solid #c8ff64;outline-offset:4px}.scrub{display:flex;align-items:center;gap:15px;flex:1;min-width:0}input[type=range]{width:100%;accent-color:#c8ff64;cursor:pointer}.time{font-size:12px;font-variant-numeric:tabular-nums;color:#a8aaa3;white-space:nowrap}footer{max-width:1240px;width:100%;margin-top:25px;display:flex;justify-content:space-between;gap:20px;color:#a8aaa3;font-size:13px;line-height:1.7}footer strong{display:block;color:#f2f0e6;font-size:19px;font-weight:400;letter-spacing:-.025em}.note{text-align:right}audio{display:none}@media(max-width:640px){body{padding:22px 12px 25px;justify-content:center}header{margin-bottom:17px;padding:0 7px}header strong{font-size:20px}header span{font-size:11px}.player{border-radius:12px}.controls{flex-wrap:wrap;gap:9px;padding:12px;min-height:96px}.scrub{order:3;flex-basis:100%;gap:9px}button{padding:9px 12px;font-size:12px}footer{padding:0 7px;display:block;margin-top:20px;font-size:12px}.note{text-align:left;margin-top:14px}footer strong{font-size:17px}}</style></head><body><header><strong>IT뱅구</strong><span>PURE SOL · 128 BPM</span></header><main class="player" aria-label="IT뱅구 모션 필름"><div class="screen"><canvas id="film" width="1920" height="1080" aria-label="한 점이 선, 도형, 휴대폰, 글자로 이어지는 IT뱅구 영상"></canvas></div><div class="controls"><button class="primary" id="play" type="button">재생</button><button id="restart" type="button">처음부터</button><button id="sound" type="button" aria-pressed="true">소리 켜짐</button><div class="scrub"><input id="seek" type="range" min="0" max="37.5" step="0.01" value="0" aria-label="재생 위치"><span class="time" id="time">0:00 / 0:38</span></div></div></main><footer><div><strong>한 점의 상상이, 실제 작업이 되기까지.</strong>AI 영상 · 사운드 · 옵시디언 · Ego Lite</div><div class="note">GPT 6.1 Sol의 오리지널 모션과 음악<br>37.5초 · 128 BPM</div></footer><audio id="master" src="audio/master.mp3" preload="auto"></audio><script src="film.js"></script><script>
(()=>{const audio=document.getElementById('master'),play=document.getElementById('play'),restart=document.getElementById('restart'),sound=document.getElementById('sound'),seek=document.getElementById('seek'),time=document.getElementById('time');let raf=0;const fmt=t=>'0:'+String(Math.floor(t)).padStart(2,'0');function paint(){cancelAnimationFrame(raf);raf=0;const t=Math.min(37.5,audio.currentTime);window.renderFrame(t);seek.value=t;time.textContent=fmt(t)+' / 0:38';if(!audio.paused)raf=requestAnimationFrame(paint)}function pause(){audio.pause();cancelAnimationFrame(raf);play.textContent='재생';paint()}async function start(){await window.filmReady;if(audio.currentTime>=37.4)audio.currentTime=0;await audio.play();play.textContent='일시정지';cancelAnimationFrame(raf);paint()}play.addEventListener('click',()=>audio.paused?start():pause());restart.addEventListener('click',()=>{audio.currentTime=0;paint();start()});sound.addEventListener('click',()=>{audio.muted=!audio.muted;sound.textContent=audio.muted?'소리 꺼짐':'소리 켜짐';sound.setAttribute('aria-pressed',String(!audio.muted))});seek.addEventListener('input',()=>{audio.currentTime=Number(seek.value);paint()});audio.addEventListener('ended',()=>{pause();window.renderFrame(37.5);seek.value=37.5});document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();audio.paused?start():pause()}if(e.code==='ArrowRight'){audio.currentTime=Math.min(37.49,audio.currentTime+2);paint()}if(e.code==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-2);paint()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.filmReady.then(paint);})();
</script></body></html>
