<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080911"><meta name="robots" content="noindex,nofollow"><meta name="description" content="AI 전문 채널 IT뱅구 — 3D 모바일 인트로 모션 디자인 미리보기"><title>IT뱅구 · 모바일 인트로</title>
<style>
@font-face{font-family:Pretendard;src:url('motion/assets/fonts/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Pretendard;src:url('motion/assets/fonts/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#080911;color:#f6f5ff;font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1320px;margin:0 auto;padding:30px 32px 40px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.04em}.brand-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#ffa8f6,#a2c8ff);color:#171024;font-weight:700}.edition{font-size:10px;letter-spacing:.15em;color:#c3bfce}.intro-label{font-size:11px;letter-spacing:.18em;color:#b9a9d7;margin:0 0 9px}.heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}h1{font-size:clamp(24px,3.5vw,36px);font-weight:700;letter-spacing:-.05em;margin:0}.formats{display:flex;gap:4px;background:#141520;padding:4px;border:1px solid #272733;border-radius:13px}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e2b4ff;outline-offset:4px}.formats button{min-height:40px;padding:0 17px;background:none;color:#9a98ad;border-radius:9px;font-size:12px}.formats button[aria-pressed=true]{background:#383344;color:#fff}.viewport{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:22px;background:#100b20;border:1px solid #2b213a;box-shadow:0 35px 100px #0007}.viewport[data-format=portrait]{aspect-ratio:1206/2622;max-width:520px;margin:0 auto}iframe{display:block;position:absolute;left:0;top:0;border:0;transform-origin:top left}.loading{position:absolute;inset:0;display:grid;place-content:center;color:#c6bfdb;font-size:14px;pointer-events:none}.viewport.ready .loading{display:none}.controls{max-width:100%;display:flex;gap:12px;align-items:center;padding-top:16px}.controls button{width:44px;height:44px;background:#1b1a28;color:#fff;border-radius:13px;display:grid;place-items:center;flex-shrink:0}.controls button:hover{background:#2e293d}.controls svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}input[type=range]{width:100%;accent-color:#dba7ff;height:30px;cursor:pointer}#clock{font-size:11px;font-variant-numeric:tabular-nums;color:#beb9cb;white-space:nowrap;min-width:65px}.details{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;border-top:1px solid #252430;margin-top:26px;padding-top:20px}.details p{margin:0;color:#a8a4b9;font-size:13px;line-height:1.8}.details strong{color:#ebe8f6;font-weight:400}.channel{color:#e9d6fa;text-decoration:none;font-size:12px;line-height:1.8;white-space:nowrap;min-height:44px;display:flex;align-items:flex-start}.fine{color:#69677b;font-size:11px;margin-top:20px;line-height:1.7}.error{color:#ffb0d8}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:640px){main{padding:20px 16px max(26px,env(safe-area-inset-bottom))}.masthead{margin-bottom:22px}.edition{font-size:9px;letter-spacing:.08em}.heading-row{align-items:center;margin-bottom:16px}h1{font-size:24px}.formats button{padding:0 12px;font-size:11px;min-height:36px}.viewport{border-radius:18px}.details{margin-top:20px;gap:12px}.details p{font-size:12px}.channel{font-size:11px}.fine{margin-top:12px}.intro-label{font-size:9px} .controls{gap:10px}}
</style>
</head><body><main>
<header class="masthead"><div class="brand"><span class="brand-icon" aria-hidden="true">9</span>IT뱅구</div><span class="edition">INTRO DESIGN / 03</span></header>
<p class="intro-label">AI CHANNEL · MOTION PREVIEW</p><div class="heading-row"><h1>작은 화면, 큰 가능성.</h1><div class="formats" role="group" aria-label="화면 비율"><button id="portrait" aria-pressed="false">모바일</button><button id="wide" aria-pressed="false">16:9</button></div></div>
<div class="viewport" id="viewport"><div class="loading" id="loading">인트로를 불러오는 중…</div><iframe id="film" title="AI 전문 채널 IT뱅구 · 3D 모바일 인트로" scrolling="no"></iframe></div>
<div class="controls"><button id="toggle" aria-label="일시정지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button><button id="replay" aria-label="처음부터 다시 재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button><label class="sr-only" for="scrub">재생 위치</label><input id="scrub" type="range" min="0" max="8" step=".01" value="0"><span id="clock">0.0 / 8.0</span><button id="fullscreen" aria-label="디자인 전체 화면"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></div>
<div class="details"><p><strong>AI 전문 채널 IT뱅구</strong><br>흐르는 그라디언트 · 아이폰 비율 · 흐르는 빛 · 구독과 좋아요</p><a class="channel" href="https://www.youtube.com/@ITbaeng9" target="_blank" rel="noopener noreferrer">채널 보러 가기 ↗</a></div>
<p class="fine">8초 모션 디자인 시안 · 무음 재생 · 수정 03<br>화면 속 구독·좋아요는 인트로 연출입니다.</p><noscript><p>모션 미리보기에는 JavaScript가 필요합니다.</p></noscript>
</main><script>
const frame=document.getElementById('film'),box=document.getElementById('viewport'),range=document.getElementById('scrub'),clock=document.getElementById('clock'),toggle=document.getElementById('toggle');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let format='',timeline=null,time=reduce?5.8:0,playing=!reduce,previous=null;
function resize(){const w=format==='portrait'?1206:1920,h=format==='portrait'?2622:1080;frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(box.clientWidth/w,box.clientHeight/h);frame.style.transform='scale('+scale+')';frame.style.left=(box.clientWidth-w*scale)/2+'px';frame.style.top=(box.clientHeight-h*scale)/2+'px';}
function icon(){toggle.setAttribute('aria-label',playing?'일시정지':'재생');toggle.innerHTML=playing?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>';}
function select(next){if(format===next)return;format=next;timeline=null;previous=null;box.classList.remove('ready');box.dataset.format=format;document.getElementById('portrait').setAttribute('aria-pressed',format==='portrait');document.getElementById('wide').setAttribute('aria-pressed',format==='wide');document.getElementById('loading').textContent='인트로를 불러오는 중…';frame.src='motion/'+(format==='portrait'?'portrait.html':'index.html')+'?rev=3';resize();}
frame.addEventListener('load',()=>{try{timeline=frame.contentWindow.__timelines?.[format==='portrait'?'portrait':'main'];if(!timeline)throw Error('timeline unavailable');timeline.pause();timeline.seek(time);box.classList.add('ready');}catch(e){document.getElementById('loading').innerHTML='<span class="error">미리보기를 불러오지 못했습니다. 새로고침해 주세요.</span>';}});
function render(stamp){if(previous!==null&&playing&&timeline&&!document.hidden){time+=(stamp-previous)/1000;if(time>8)time%=8;}previous=stamp;if(timeline)timeline.seek(time);range.value=time;clock.textContent=time.toFixed(1)+' / 8.0';requestAnimationFrame(render);}
toggle.addEventListener('click',()=>{playing=!playing;previous=null;icon();});document.getElementById('replay').addEventListener('click',()=>{time=0;playing=true;previous=null;icon();});range.addEventListener('input',()=>{time=Number(range.value);playing=false;icon();});document.getElementById('portrait').addEventListener('click',()=>select('portrait'));document.getElementById('wide').addEventListener('click',()=>select('wide'));document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement&&box.requestFullscreen)await box.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen();else{box.scrollIntoView({block:'center',behavior:'smooth'});}}catch{box.scrollIntoView({block:'center',behavior:'smooth'});}});document.addEventListener('visibilitychange',()=>{previous=null;});new ResizeObserver(resize).observe(box);icon();select(innerWidth<=640?'portrait':'wide');requestAnimationFrame(render);
</script></body></html>
